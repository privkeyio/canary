[package]
name = "canary"
version = "1.7.0"
edition = "2021"

[lib]
name = "canary"
path = "src/lib.rs"

[dependencies]
bdk_wallet = { version = "~3.1", features = ["rusqlite"] }
bdk_electrum = "~0.24"
miniscript = "13.1"
axum = "0.8"
tower-http = { version = "0.7", features = ["cors"] }
tokio = { version = "1.46", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
dotenvy = "0.15"
phonenumber = "0.3"
icu = "2"
fixed_decimal = "0.7"
writeable = "0.6"
r2d2 = "0.8"
r2d2_sqlite = "0.24"
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json", "form"] }
url = "2"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
base64 = "0.23"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
rand = "0.10"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
argon2 = { version = "0.6", features = ["rand_core"] }
uuid = { version = "1", features = ["v4"] }
resend-rs = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
regex = "1.10"
futures = "0.3"
once_cell = "1.20"
xyzpub = "0.3"
rust-i18n = "4"
iso_currency = "0.7.0"
unic-langid = "0.9.6"
nostr-sdk = { version = "0.45.2", default-features = false, features = ["aws_lc_rs", "rustls-tls-native-roots"] }
nostr = { version = "0.45", features = ["nip04", "nip44", "nip59"] }
nostr-gossip-memory = "0.45"
totp-rs = { version = "6", default-features = false, features = ["std"] }

[dev-dependencies]
# Loopback relay used to verify the production client's NIP-42 authentication.
tokio-tungstenite = "0.30"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3.3"
xyzpub = "0.3"

