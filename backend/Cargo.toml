[[test]]
name = "blake2b_hardfork_headers"
path = "system_tests/blake2b_hardfork_headers.rs"

# Bitcoin Knots' BLAKE2b proof-of-work hardfork made the block header self-describing: past the
# activation height it may be 164 bytes rather than 80. Stock rust-bitcoin parses 80 and rejects
# the rest, which is why syncing against a Knots-backed Electrum server fails with
# "data not consumed entirely when explicitly deserializing".
#
# Both crates are pinned to an immutable rev rather than a branch, since they carry consensus code.
# Each rev is also tagged in its repo (blake2b-hardfork-0.32-v1, blake2b-extended-headers-v1) so a
# force-push cannot orphan it and break every clean build, including the Docker image.
# bdk_wallet and bdk_electrum need no fork; they inherit the fix through `bitcoin`.
[patch.crates-io]
bitcoin = { git = "https://github.com/privkeyio/rust-bitcoin", rev = "e9aa336977e334f29fbe440a0dc0d21fa739fbf6" }
electrum-client = { git = "https://github.com/privkeyio/rust-electrum-client", rev = "b5c4e202c84e39791e50e92ca576b2ad38bed02e" }
# phonenumber needs postcard's std serialization, not embedded heapless atomics.
postcard = { path = "vendor/postcard" }
